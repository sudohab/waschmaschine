; Waschmaschinen-Sensor: SW-420 an newsroom21 – zwei Bauarten, eine Firmware
;   esp32dev  ESP32-DevKit, Sensor an GPIO27, Summer an GPIO25
;   esp01s    ESP-01S (ESP8266, 1 MB Flash), Sensor an GPIO3 (RX)
; Alle Versionen fest gepinnt, damit Builds reproduzierbar bleiben.
[platformio]
default_envs = esp32dev, esp01s

[env:esp32dev]
; Dieselbe Plattform wie die Farbuhr (UHR64): mbedTLS 3.6 prüft den
; IP-Eintrag im Zertifikat von newsroom21 – keine Ausnahme nötig.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31-2/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
; default.csv hat zwei Programmbereiche (je 1,25 MB) – Voraussetzung für
; Updates über das Netz (OTA) mit Rückfall auf die alte Firmware.
board_build.partitions = default.csv
lib_deps =
  bblanchon/ArduinoJson@6.21.5

[env:esp01s]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
; 1 MB Flash: ca. 950 KB Programm, 64 KB LittleFS für Token und Pi-Adresse.
; Kein OTA, kein Webserver: Updates per USB-Adapter (siehe HANDBUCH.md).
board_build.ldscript = eagle.flash.1m64.ld
board_build.filesystem = littlefs
monitor_speed = 115200
; Der Adapter hat keine Reset-Leitungen – aufgespielt wird mit esptool und
; "--before no-reset" (siehe HANDBUCH.md), nicht mit "pio run -t upload".
build_flags =
  ; Zweiter Heap im IRAM (~17 KB) für die 16-KB-TLS-Puffer von BearSSL –
  ; bei den ESP8266-Uhren (UHR) ohne diese Option keine HTTPS-Verbindung.
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
